[policy]
canonical_host = "127.0.0.1"
llama_build = "b10076"
chat_model_id = "Qwen3.6-35B-A3B-UD-IQ4_XS"
embedding_model_id = "Qwen3-Embedding-0.6B"
embedding_dimension = 1024
compose_readiness_seconds = 120
compose_command_timeout_seconds = 300
migration_timeout_seconds = 60
launcher_readiness_seconds = 120
