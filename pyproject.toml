[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pensae"
version = "0.0.0"
description = "Local-first problem-first opportunity discovery"
requires-python = "==3.13.*"
dependencies = [
  "aiohttp>=3.11,<4",
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6,<7",
  "redis>=5,<7",
  "sqlalchemy>=2.0,<3",
  "trafilatura>=2,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "anyio>=4.8,<5",
  "pyright>=1.1,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pensae"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config -p no:langsmith_plugin"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires disposable local Compose infrastructure",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src", "tests", "scripts"]
exclude = ["frontend", ".venv"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "none"
